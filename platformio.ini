[platformio]
default_envs = waveshare-esp32-s3-touch-amoled-2-06

[env:waveshare-esp32-s3-touch-amoled-2-06]
; Arduino-ESP32 3.3.11 on ESP-IDF 5.5.5, matching Waveshare's maintained
; Arduino toolchain at the time this target was created.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200
upload_speed = 921600
monitor_filters = esp32_exception_decoder, time

board_upload.flash_size = 16MB
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_build.partitions = partitions/waveshare_16mb.csv
board_build.filesystem = littlefs

build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_LOOP_STACK_SIZE=16384

lib_deps =
    moononournation/GFX Library for Arduino @ 1.6.7
    bblanchon/ArduinoJson @ 7.4.2
    bodmer/TJpg_Decoder @ 1.1.0
    lewisxhe/SensorLib @ 0.3.1
    tanakamasayuki/ESP32CertBundle @ 20260514.0.0
