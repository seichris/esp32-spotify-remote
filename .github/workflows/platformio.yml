name: PlatformIO

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Repository safety checks
        run: python tools/check_repository.py
      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio
      - name: Supply non-secret CI configuration
        run: cp include/secrets.example.h include/secrets.h
      - name: Build firmware
        run: pio run
